# Machine-readable project contract (roadmap-discipline rules, global CLAUDE.md 2026-07-01).
# Volatile numbers live in derived: as commands, never hand-copied into prose.

name: comment-conspiracy
description: Daily Reddit game (Devvit) — spot the AI-generated comment among 5. Live on r/CommentConspiracy.
authoritative_plan: PROJECT.yaml   # TODO.md is HISTORICAL (launch checklist, superseded 2026-07-24); no other plan doc exists

# live-proven: deployed (v0.0.16 live 6-03), scheduler posting daily, hackathon submitted 2026-02-02.
# NOT customer-used in the revenue sense — it's a free community game; "used" = daily Reddit players.
ladder: live-proven

derived:
  test_count: "npx vitest run 2>&1 | grep 'Tests '   # live 2026-07-24: 2757 passing, 6 files; CI runs the same suite (real test gate since 7-18)"
  puzzle_count: "node -e \"const fs=require('fs'),p='src/data/bootstrap';let t=0;for(const f of fs.readdirSync(p)){if(!f.endsWith('.json'))continue;const j=JSON.parse(fs.readFileSync(p+'/'+f,'utf8'));t+=Array.isArray(j)?j.length:(j.puzzles?.length||0);}console.log(t)\"   # live 2026-07-24: 282, through week 43 (~2026-11-08)"
  deployed_version: "npx devvit list installs   # verified 2026-07-24: prod r/CommentConspiracy runs v0.1.4 (devvit-side version); package.json (0.0.16) is a local dev counter, NOT the deployed marker"
  head: "git rev-parse --short HEAD"
  branch: "git branch --show-current"

gates:
  - id: content-runway
    metric: days_of_scheduled_puzzles_remaining (bootstrap content ends ~2026-11-08 at week 43)
    target: "extend or decide sunset >= 14 days before exhaustion (i.e. by 2026-10-25)"
    kill: "no extension decision by 2026-10-25 -> post a farewell/completed banner puzzle and let the scheduler run out cleanly (never a silent dead subreddit)"
    owner: steve
    due: 2026-10-23   # RE-DATED 2026-09-25 from 2026-10-25 on the runway read below: the last scheduled puzzle is 2026-11-06, not "~11-08", so the gate's own "≥ 14 days before exhaustion" rule lands on 10-23. Recorded, not a silent slip.
    runway_read_2026_09_25: >-
      READ FROM THE REPO (Steve: "DO: read the runway now", /daily-priority): src/data holds 282 dated
      puzzle ids (week01–week43), first 2026-01-19, LAST 2026-11-06 (42 days from the read), 10 missing
      days inside the range. Exhaustion = the day after 2026-11-06; the metric's "~2026-11-08" was two
      days optimistic. Decision deadline = 2026-10-23 (14 days before), which is why `due` moved.
      Live subreddit read blocked (reddit JSON returns HTML to scripts); re-read the last posted Day N
      in a browser before ruling.
    ratified: 2026-09-25   # Steve, /daily-priority AskUserQuestion: "ratify all three as written" — target + kill above were PROPOSED (tagged 2026-07-24) until today
market:
  competitors_doc: "not authored — daily-puzzle Reddit games (Devvit showcase titles, NYT-style dailies); free community game, not a commercial entrant"
  wtp_evidence: none
  demand_signal: "organic — r/CommentConspiracy daily players (uninstrumented beyond Reddit-native metrics)"

monetization_path: "none by design — free community/hackathon game; kill condition lives on the content-runway gate"

post_event_plan: >-
  Hackathon (Reddit Games & Puzzles 2026) submitted 2026-02-02; deadline passed 2026-02-12.
  Win: publicize + consider content automation. Lose/no-verdict (current state): zombie-prevention
  is the content-runway gate above — the game stays live only while scheduled content exists and
  the daily scheduler works; on exhaustion without a decision, close out cleanly per the kill line.
